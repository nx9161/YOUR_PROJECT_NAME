[project]
name = "arbitrage-engine"
version = "0.1.0"
description = "Find resale/dropshipping arbitrage opportunities and generate listings, 24/7."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
arbitrage = "arbitrage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arbitrage", "arbitrage.adapters"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
